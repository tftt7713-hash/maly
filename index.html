     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalpvrish Jadi-Buti Bhandar</title>
    <style>
        /* Pura page center karne ke liye aur Ayurvedic Background ke liye */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Natural Green gradient background */
            background: linear-gradient(135deg, #11998e, #38ef7d); 
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        /* Container jo sab kuch beech mein rakhega */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Tagda Ayurvedic Button */
        .ayurvedic-btn {
            padding: 25px 60px; /* Bada size */
            font-size: 26px; /* Bada text */
            font-weight: bold;
            color: #ffffff;
            /* Jadi-buti organic brown aur dark green gradient */
            background: linear-gradient(45deg, #2e7d32, #1b5e20); 
            border: 3px solid #aed581; /* Light green border */
            border-radius: 50px; /* Rounded capsule look */
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* Hover karne par tagda effect (Ped-paudhe jaisa growth feel) */
        .ayurvedic-btn:hover {
            transform: scale(1.1); /* Button bada ho jayega */
            background: linear-gradient(45deg, #1b5e20, #2e7d32);
            box-shadow: 0 15px 35px rgba(56, 239, 125, 0.6); /* Green glow effect */
            border-color: #ffffff;
        }

        /* Button ke neeche ka text (Kalpvrish Jadi-Buti Bhandar) */
        .brand-text {
            margin-top: 25px; /* Button se thoda neeche */
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 1.5px;
        }

        /* Chota subtitle decoration ke liye */
        .subtitle-text {
            font-size: 16px;
            color: #f1f8e9;
            margin-top: 5px;
            font-style: italic;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Beech mein bada tagda button -->
        <a href="next.html" class="ayurvedic-btn">🌱 Pravesh Karein</a>

        <!-- Button ke theek neeche aapka naam -->
        <div class="brand-text">Kalpvrish Jadi-Buti Bhandar</div>
        <div class="subtitle-text">Prakriti ka Aushadhiya Uphaar</div>
    </div>

</body>
</html>
